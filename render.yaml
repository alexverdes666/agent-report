services:
  - type: web
    name: agent-report-scraper
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: BROWSER_HEADLESS
        value: "true"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: SCRAPER_USERNAME
        sync: false
      - key: SCRAPER_PASSWORD
        sync: false
      # MongoDB Configuration
      - key: MONGODB_CONNECTION_STRING
        sync: false
      - key: MONGODB_DATABASE
        value: "agent_reports"
      - key: MONGODB_COLLECTION
        value: "reports"
      - key: MONGODB_AGENTS_COLLECTION
        value: "agents"

  # Daily 02:00 UTC scrape is now driven by an in-process APScheduler inside
  # the web service (see _start_scheduler in app.py). No separate Render cron
  # service is needed — the previous `daily-scraper-cron` block pointed at a
  # daily_scraper.py that didn't exist in the repo, so it never ran.
